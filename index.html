<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Family CookBook</title>
<style>
:root {
  --bg: #faf6f0; --surface: #ffffff; --ink: #2b2420; --muted: #7a6e66;
  --line: #e8dfd4; --accent: #b4532a; --accent-soft: #f6e4d9; --chip: #f1ebe3;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1916; --surface: #26221e; --ink: #f1e9e1; --muted: #a8998c;
    --line: #3a332d; --accent: #e8875a; --accent-soft: #3d2a20; --chip: #2f2a25;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 32px 16px 8px; max-width: 1100px; margin: 0 auto; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2.2rem; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 4px 0 0; }
main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
.controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 0 12px; border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); }
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 12px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.group-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); padding: 4px 11px; border-radius: 999px;
  font-size: .875rem; cursor: pointer; }
.chip:hover { border-color: var(--line); }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
.bar { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 12px; color: var(--muted); font-size: .9rem; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: .9rem; padding: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer;
  box-shadow: var(--shadow); text-align: left; color: inherit; font: inherit; display: flex; flex-direction: column; gap: 10px; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card h3 { margin: 0; font-family: Georgia, serif; font-size: 1.15rem; line-height: 1.3; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: .75rem; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
.meta { display: flex; gap: 12px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
.macros div { text-align: center; }
.macros b { display: block; font-size: 1rem; }
.macros span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }

/* detail */
.overlay { position: fixed; inset: 0; background: rgba(20,14,10,.55); display: none; z-index: 20; overflow-y: auto; padding: 24px 16px; }
.overlay.open { display: block; }
.detail { background: var(--surface); max-width: 760px; margin: 0 auto; border-radius: 16px; padding: 28px; position: relative; box-shadow: var(--shadow); }
.close { position: absolute; top: 14px; right: 14px; border: 0; background: var(--chip); color: var(--ink); width: 36px; height: 36px;
  border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
.detail h2 { font-family: Georgia, serif; font-size: 1.8rem; margin: 0 40px 8px 0; line-height: 1.2; }
.detail .intro { color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 18px 0; }
.fact { background: var(--chip); border-radius: 10px; padding: 8px 10px; }
.fact span { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.detail h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 24px 0 8px; }
.detail h4 { margin: 12px 0 4px; font-size: .95rem; }
.detail ul, .detail ol { padding-left: 1.3em; margin: 0; }
.detail li { margin: 4px 0; }
.detail ol li { margin: 8px 0; }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nutri div { background: var(--accent-soft); border-radius: 10px; padding: 10px; text-align: center; }
.nutri b { display: block; font-size: 1.3rem; color: var(--accent); }
.nutri span { font-size: .75rem; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.stepper button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 1rem; line-height: 1; cursor: pointer; }
.stepper button:hover { border-color: var(--accent); }
.stepper input { width: 44px; text-align: center; font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); padding: 2px 0; }
.qty.scaled { color: var(--accent); font-weight: 600; }
.scale-note { font-size: .85rem; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; }
.tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; font: inherit; font-weight: 600;
  color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #fff;
  font-size: .75rem; line-height: 20px; text-align: center; margin-left: 4px; }
.badge:empty { display: none; }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.planbtn { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 999px;
  padding: 3px 10px; font-size: .8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.planbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; padding-top: 20px; }
.plan h2 { font-family: Georgia, serif; font-size: 1.4rem; margin: 0 0 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .pt { flex: 1; min-width: 0; }
.prow .pt button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.prow .pt button:hover { color: var(--accent); }
.prow .pt small { display: block; color: var(--muted); }
.x { border: 0; background: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 4px; }
.x:hover { color: var(--accent); }
.totals { margin-top: 12px; font-size: .85rem; color: var(--muted); }
.shop { list-style: none; padding: 0; margin: 0; }
.shop li { border-bottom: 1px solid var(--line); }
.shop li:last-child { border-bottom: 0; }
.shop label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.shop input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.shop .amt { font-weight: 600; }
.shop small { display: block; color: var(--muted); font-size: .78rem; }
.shop li.done .itm { text-decoration: line-through; color: var(--muted); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.panel-head h2 { margin: 0; }
.links { display: flex; gap: 14px; }
.export { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.export .btn { padding: 6px 12px; font-size: .85rem; }
.export label { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-left: auto; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.qrbox { position: fixed; inset: 0; background: rgba(20,14,10,.6); display: none; z-index: 30; align-items: center; justify-content: center; padding: 16px; }
.qrbox.open { display: flex; }
.qrcard { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 460px; width: 100%; text-align: center; position: relative; }
.qrcard h3 { margin: 0 0 6px; font-family: Georgia, serif; }
.qrimg { background: #fff; padding: 12px; border-radius: 10px; display: inline-block; margin: 10px 0; }
.qrimg svg { display: block; width: min(360px, 75vw); height: auto; }
@media (max-width: 760px) { .plan { grid-template-columns: 1fr; } }
.small { font-size: .85rem; color: var(--muted); }
.src { margin-top: 24px; font-size: .9rem; color: var(--muted); word-break: break-word; }
.src a { color: var(--accent); }
.actions { margin-top: 20px; display: flex; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .9rem; }
@media (max-width: 640px) {
  .cols { grid-template-columns: 1fr; gap: 0; }
  .detail { padding: 22px 18px; }
  h1 { font-size: 1.8rem; }
}
@media print {
  body { background: #fff; }
  body:not(.printing-plan) header, body:not(.printing-plan) main { display: none; }
  body.printing-plan .tabs, body.printing-plan .links, body.printing-plan .export, body.printing-plan .x, body.printing-plan .stepper button { display: none; }
  body.printing-plan .panel { box-shadow: none; }
  .overlay { position: static; background: none; padding: 0; display: block; }
  .detail { box-shadow: none; padding: 0; }
  .close, .actions { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Family CookBook</h1>
  <p class="sub" id="count"></p>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-recipes" aria-selected="true" onclick="showTab('recipes')">Recipes</button>
    <button class="tab" role="tab" id="tab-plan" aria-selected="false" onclick="showTab('plan')">Meal Prep<span class="badge" id="planCount"></span></button>
  </nav>
</header>
<main>
 <section id="view-recipes">
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search recipes or ingredients…" aria-label="Search">
    <div class="filters" id="filters"></div>
  </div>
  <div class="bar"><span id="showing"></span><button class="linkbtn" id="clear" hidden>Clear filters</button></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No recipes match. Try clearing a filter.</p>
 </section>
 <section id="view-plan" hidden>
  <div class="plan">
    <div class="panel">
      <div class="panel-head"><h2>This week's meals</h2>
        <div class="links"><button class="linkbtn" id="clearPlan">Clear plan</button></div></div>
      <div id="planList"></div>
      <div class="totals" id="planTotals"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Shopping list</h2>
        <div class="links"><button class="linkbtn" id="uncheck">Uncheck all</button><button class="linkbtn" onclick="printPlan()">Print</button></div></div>
      <div class="export" id="exportBar">
        <button class="btn" onclick="copyList()">Copy list</button>
        <button class="btn" onclick="emailList()">Email list</button>
        <button class="btn primary" onclick="showQR()">Show QR code</button>
        <label><input type="checkbox" id="skipChecked" checked> Leave out checked items</label>
      </div>
      <ul class="shop" id="shopList"></ul>
    </div>
  </div>
 </section>
</main>
<div class="qrbox" id="qrbox" role="dialog" aria-modal="true">
  <div class="qrcard">
    <button class="close" aria-label="Close" onclick="closeQR()">×</button>
    <h3>Scan with your phone</h3>
    <p class="small" style="margin:0">Open your phone's camera and point it at the code. Tap the text that pops up to copy it into Notes or a message.</p>
    <div id="qrout"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <article class="detail" id="detail"></article>
</div>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);

out 2 tbsp ranch. Meatballs alone are about 550 calories, 55 g protein, 12 g carbs, and 30 g fat per serving. Actual numbers vary by brand and portion.<\/em><\/p>", "notes": "<ul>\n<li>Despite the name, the recipe uses ground turkey. Ground chicken works as a swap.<\/li>\n<li>550°F is very hot; check them a couple minutes early the first time.<\/li>\n<li>Servings are a guess (the original doesn&#x27;t say). 3 lbs of meat makes roughly 6 hearty subs.<\/li>\n<\/ul>"}, {"id": "caprese-chicken-salad-bowls", "file": "recipes/caprese-chicken-salad-bowls.md", "title": "Caprese Chicken Salad Meal Prep Bowls", "meal_type": ["Lunch", "Dinner"], "flavor": ["Savory"], "cuisine": ["Italian"], "complexity": "Easy", "prep_time": "15 min", "cook_time": "25 min", "prep_min": 15, "total_min": 40, "servings": 4, "source": "https://sweetpeasandsaffron.com/caprese-chicken-salad-meal-prep-bowls/", "source_is_url": true, "nutrition": {"calories": 525, "protein": 39, "carbs": 32, "fat": 26}, "intro": "<p>Balsamic baked chicken over quinoa with cherry tomatoes, mini mozzarella, and fresh basil. Keeps 4 days in the fridge.<\/p>", "shopping": [{"q": 0.75, "q2": null, "unit": "cup", "name": "quinoa", "key": "quinoa|vol", "raw": "¾ cup quinoa, uncooked"}, {"q": 1.0, "q2": null, "unit": "tbsp", "name": "olive oil", "key": "olive oil|vol", "raw": "1 tbsp olive oil"}, {"q": 1.0, "q2": null, "unit": "tbsp", "name": "balsamic vinegar", "key": "balsamic vinegar|vol", "raw": "1 tbsp balsamic vinegar"}, {"q": 1.0, "q2": null, "unit": "lb", "name": "boneless skinless chicken breasts (about 2 large)", "key": "boneless skinless chicken breast|wt", "raw": "1 lb boneless skinless chicken breasts (about 2 large)"}, {"q": null, "q2": null, "unit": "", "name": "Salt and pepper", "key": "salt and pepper|", "raw": "Salt and pepper"}, {"q": 3.0, "q2": null, "unit": "cup", "name": "cherry tomatoes", "key": "cherry tomatoe|vol", "raw": "3 cups cherry tomatoes, halved"}, {"q": 1.0, "q2": null, "unit": "bunch", "name  "total_min": 75, "servings": 6, "source": "https://www.thewholesomedish.com/the-best-classic-shepherds-pie/", "source_is_url": true, "nutrition": {"calories": 505, "protein": 22, "carbs": 36, "fat": 30}, "intro": "<p>Herby ground beef (or lamb) and veggies in a rich gravy, topped with buttery parmesan mashed potatoes and baked until golden.<\/p>", "shopping": [{"q": 2.0, "q2": null, "unit": "tbsp", "name": "olive oil", "key": "olive oil|vol", "raw": "2 tbsp olive oil"}, {"q": 1.0, "q2": null, "unit": "cup", "name": "yellow onion", "key": "yellow onion|vol", "raw": "1 cup yellow onion, chopped"}, {"q": 1.0, "q2": null, "unit": "lb", "name": "ground beef (90% lean)", "key": "ground beef|wt", "raw": "1 lb ground beef (90% lean), or ground lamb"}, {"q": 2.0, "q2": null, "unit": "tsp", "name": "dried parsley", "key": "dried parsley|vol", "raw": "2 tsp dried parsley"}, {"q": 1.0, "q2": null, "unit": "tsp", "name": "dried rosemary", "key": "dried rosemary|vol", "raw": "1 tsp dried rosemary"}, {"q": 1.0, "q2": null, "unit": "tsp", "name": "dried thyme", "key": "dried thyme|vol", "raw": "1 tsp dried thyme"}, {"q": 0.5, "q2": null, "unit": "tsp", "name": "salt", "key": "salt|vol", "raw": "½ tsp salt"}, {"q": 0.5, "q2": null, "unit": "tsp", "name": "black pepper", "key": "black pepper|vol", "raw": "½ tsp black pepper"}, {"q": 1.0, "q2": null, "unit": "tbsp", "name": "Worcestershire sauce", "key": "worcestershire sauce|vol", "raw": "1 tbsp Worcestershire sauce"}, {"q": 2.0, "q2": null, "unit": "", "name": "garlic cloves", "key": "garlic clove|", "raw": "2 garlic cloves, minced"}, {"q": 2.0, "q2": null, "unit": "tbsp", "name": "all-purpose flour", "key": "all purpose flour|vol", "raw": "2 tbsp all-purpose flour"}, {"q": 2.0, "q2": null, "unit": "tbsp", "name": "tomato paste", "key": "tomato paste|vol", "raw": "2 tbsp tomato paste"}, {"q": 1.0, "q2": null, "unit": "cup", "name": "beef broth", "key": "beef broth|vol", "raw": "1 cup beef broth"}, {"q": 1.0, "q2": null, "unit": "cup", "name": "frozen peas and carrots", "key": "frozen peas and carrot|vol", "raw": "1 cup frozen peas and carrots"}, {"q": 0.5, "q2": null, "unit": "cup", "name": "frozen corn", "key": "frozen corn|vol", "raw": "½ cup frozen corn"}, {"q": 1.5, "q2": 2.0, "unit": "lb", "name": "russet potatoes (about 2 large)", "key": "russet potatoe|wt", "raw": "1 ½–2 lb russet potatoes (about 2 large), peeled and cut into 1-inch cubes"}, {"q": 8.0, "q2": null, "unit": "tbsp", "name": "unsalted butter (1 stick)", "key": "unsalted butter|vol", "raw": "8 tbsp unsalted butter (1 stick)"}, {"q": 0.3333333333333333, "q2": null, "unit": "cup", "name": "half-and-half", "key": "half and half|vol", "raw": "⅓ cup half-and-half"}, {"q": 0.5, "q2": null, "unit": "tsp", "name": "garlic powder", "key": "garlic powder|vol", "raw": "½ tsp garlic powder"}, {"q": 0.5, "q2": null, "unit": "tsp", "name": "salt", "key": "salt|vol", "raw": "½ tsp salt"}, {"q": 0.25, "q2": null, "unit": "tsp", "name": "black pepper", "key": "black pepper|vol", "raw": "¼ tsp black pepper"}, {"q": 0.25, "q2": null, "unit": "cup", "name": "grated parmesan cheese", "key": "grated parmesan cheese|vol", "raw": "¼ cup grated parmesan cheese"}], "ingredients": "<h4>Meat Filling<\/h4>\n<ul>\n<li><span class=\"qty\" data-q=\"2.0\" data-q2=\"\">2<\/span> tbsp olive oil<\/li>\n<li><span class=\"qty\" data-q=\"1.0\" data-q2=\"\">1<\/span> cup yellow onion, chopped<\/li>\n<li><span class=\"qty\" data-q=\"1.0\" data-q2=\"\">1<\/span> lb ground beef (90% lean), or ground lamb<\/li>\n<li><span class=\"qty\" data-q=\"2.0\" data-q2=\"\">2<\/span> tsp dried parsley<\/li>\n<li><span class=\"qty\" data-q=\"1.0\" data-q2=\"\">1<\/span> tsp dried rosemary<\/li>\n<li><span class=\"qty\" data-q=\"1.0\" data-q2=\"\">1<\/span> tsp dried thyme<\/li>\n<li><span class=\"qty\" data-q=\"0.5\" data-q2=\"\">½<\/span> tsp salt<\/li>\n<li><span class=\"qty\" data-q=\"0.5\" data-q2=\"\">½<\/span> tsp black pepper<\/li>\n<li><span class=\"qty\" data-q=\"1.0\" o paste until no clumps of tomato paste remain.<\/li>\n<li>Add the broth, peas and carrots, and corn. Bring to a boil, then simmer 5 minutes, stirring occasionally. Set aside.<\/li>\n<li>Preheat the oven to 400°F.<\/li>\n<li>Cover the potatoes with water in a large pot, bring to a boil, then simmer 10–15 minutes until fork-tender.<\/li>\n<li>Drain, return the potatoes to the hot pot, and let sit 1 minute so the extra water steams off.<\/li>\n<li>Add the butter, half-and-half, garlic powder, salt, and pepper and mash until smooth. Stir in the parmesan.<\/li>\n<li>Spread the meat mixture in the baking dish, then spread the mashed potatoes evenly on top.<\/li>\n<li>If the dish is very full, set it on a rimmed baking sheet. Bake uncovered at 400°F for 25–30 minutes.<\/li>\n<li>Let cool 15 minutes before serving.<\/li>\n<\/ol>", "nutrition_note": "<p><em>Per serving, assuming 6 servings with 90% lean beef and 1 ¾ lb potatoes. The site didn&#x27;t show its own numbers. About half the fat comes from the stick of butter; using 4 tbsp saves about 70 calories per serving.<\/em><\/p>", "notes": "<ul>\n<li>Shepherd&#x27;s pie is traditionally made with lamb; with beef it&#x27;s technically &quot;cottage pie.&quot; Both work.<\/li>\n<li>Make ahead: prepare the filling, the potatoes, or the whole assembled dish, cover, and refrigerate. Bake within 3 days. Take it out of the fridge about 20 minutes before baking.<\/li>\n<li>Servings are an estimate (the site doesn&#x27;t list them); a 9x9 dish feeds about 6.<\/li>\n<li>Good with roasted broccoli on the side.<\/li>\n<\/ul>"}, {"id": "josh-protein-bars", "file": "recipes/josh-protein-bars.md", "title": "Josh's Protein Bars", "meal_type": ["Breakfast", "Snack"], "flavor": ["Savory"], "cuisine": ["American"], "complexity": "Easy", "prep_time": "15 min", "cook_time": "50 min", "prep_min": 15, "total_min": 65, "servings": 5, "source": "Mythical Kitchen (Josh)", "source_is_url": false, "nutrition": {"calories": 760, "protein": 51, "carbs   } else {
    btn.textContent = p ? `Update meal plan to ${cur.servings} servings` : `Add to meal plan (${cur.servings} servings)`;
    btn.onclick = () => addToPlan(cur.id, cur.servings);
  }
}

const PLURAL = { cup: "cups", clove: "cloves", bunch: "bunches", can: "cans", container: "containers", package: "packages",
  slice: "slices", stick: "sticks", head: "heads", pinch: "pinches", dash: "dashes" };
// tsp/tbsp/cup are added together in teaspoons, oz/lb in ounces, then shown in the handiest unit
const TO_BASE = { tsp: 1, tbsp: 3, cup: 48, oz: 1, lb: 16 };
const GROUP = { tsp: "vol", tbsp: "vol", cup: "vol", oz: "wt", lb: "wt" };
function bestUnit(group, base) {
  if (group === "vol") return base >= 12 ? ["cup", 48] : base >= 3 ? ["tbsp", 3] : ["tsp", 1];
  if (group === "wt") return base >= 16 ? ["lb", 16] : ["oz", 1];
  return null;
}
const unitText = (u, amt) => !u ? "" : (amt > 1 && PLURAL[u] ? PLURAL[u] : u);

function shoppingList() {
  const items = new Map();
  plan.forEach(p => {
    const r = RECIPES.find(x => x.id === p.id); if (!r) return;
    const f = p.servings / (Number(r.servings) || 1);
    (r.shopping || []).forEach(i => {
      let it = items.get(i.key);
      if (!it) items.set(i.key, it = { key: i.key, name: i.name, unit: i.unit, group: GROUP[i.unit], lo: 0, hi: 0, hasQty: false, ranged: false, from: [] });
      if (i.q != null) {
        const m = it.group ? TO_BASE[i.unit] : 1;
        it.hasQty = true;
        it.lo += i.q * f * m;
        it.hi += (i.q2 != null ? i.q2 : i.q) * f * m;
        if (i.q2 != null) it.ranged = true;
      }
      if (!it.from.includes(r.title)) it.from.push(r.title);
    });
  });
  return [...items.values()].sort((a, b) => a.name.toLowerCase().replace(/^\(.*?\)\s*/, "").localeCompare(b.name.toLowerCase().replace(/^\(.*?\)\s*/, "")));
}

function renderPlan() {
  document.getElementById("planCount").textContent = plan.length || "";
  const list = document.getElementById("planList");
  if (!plan.length) {
    list.innerHTML = `<p class="small">No meals planned yet. Tap <b>+ Plan</b> on any recipe to add it here.</p>`;
    document.getElementById("planTotals").textContent = "";
    document.getElementById("shopList").innerHTML = `<li class="small" style="padding:8px 0">Your shopping list will appear here.</li>`;
    return;
  }
  list.innerHTML = "";
  let total = 0, cals = 0;
  plan.forEach(p => {
    const r = RECIPES.find(x => x.id === p.id);
    total += p.servings; cals += (r.nutrition.calories || 0) * p.servings;
    const row = document.createElement("div"); row.className = "prow";
    row.innerHTML = `
      <div class="pt"><button>${esc(r.title)}</button><small>${r.nutrition.calories ? r.nutrition.calories + " cal per serving" : ""}</small></div>
      <div class="stepper">
        <button aria-label="Fewer servings">−</button>
        <input type="number" min="1" max="99" value="${p.servings}" aria-label="Servings for ${esc(r.title)}">
        <button aria-label="More servings">+</button>
      </div>
      <button class="x" aria-label="Remove ${esc(r.title)}">×</button>`;
    const [minus, plus] = row.querySelectorAll(".stepper button");
    const input = row.querySelector("input");
    const set = n => { if (Number.isFinite(n) && n >= 1) { p.servings = Math.min(99, Math.round(n)); savePlan(); renderShop(); renderTotals(); } };
    minus.onclick = () => { set(p.servings - 1); input.value = p.servings; };
    plus.onclick = () => { set(p.servings + 1); input.value = p.servings; };
    input.oninput = () => set(+input.value);
    row.querySelector(".pt button").onclick = () => open(r.id);
    row.querySelector(".x").onclick = () => removeFromPlan(r.id);
    list.appendChild(row);
  });
  renderTotals();
  renderShop();
}
function renderTotals() {
  const total = plan.reduce((s, p) => s + p.servings, 0);
  document.getElementById("planTotals").textContent =
    `${plan.length} recipe${plan.length === 1 ? "" : "s"} · ${total} servings total`;
}
function shopItems() {
  return shoppingList().map(it => {
    if (it.group && it.hasQty) {
      const [u, d] = bestUnit(it.group, it.hi);
      it.unit = u; it.lo /= d; it.hi /= d;
    }
    it.amt = !it.hasQty ? "" : (it.ranged && Math.abs(it.hi - it.lo) > 1e-9 ? `${fmt(it.lo)}–${fmt(it.hi)}` : fmt(it.lo));
    it.unitLabel = unitText(it.unit, it.hi);
    it.text = [it.amt, it.unitLabel, it.name].filter(Boolean).join(" ");
    return it;
  });
}
function renderShop() {
  const ul = document.getElementById("shopList");
  ul.innerHTML = "";
  shopItems().forEach(it => {
    const amt = it.amt, unit = it.unitLabel;
    const li = document.createElement("li");
    li.className = checked[it.key] ? "done" : "";
    li.innerHTML = `<label><input type="checkbox" ${checked[it.key] ? "checked" : ""}>
      <span><span class="itm">${amt ? `<span class="amt">${esc(amt)}${unit ? " " + esc(unit) : ""}</span> ` : ""}${esc(it.name)}</span>
      <small>${esc(it.from.join(" · "))}</small></span></label>`;
    li.querySelector("input").onchange = e => {
      if (e.target.checked) checked[it.key] = true; else delete checked[it.key];
      li.className = e.target.checked ? "done" : "";
      savePlan();
    };
    ul.appendChild(li);
  });
}
/* ---------- export ---------- */
function exportItems() {
  const skip = document.getElementById("skipChecked").checked;
  return shopItems().filter(it => !(skip && checked[it.key]));
}
function listText(compact) {
  const items = exportItems();
  if (!items.length) return "";
  const lines = items.map(it => "- " + it.text);
  if (compact) return "Shopping list\n" + lines.join("\n");
  const meals = plan.map(p => {
    const r = RECIPES.find(x => x.id === p.id);
    return `- ${r.title} (${p.servings} servings)`;
  });
  return "SHOPPING LIST\n" + lines.join("\n") + "\n\nMEALS THIS WEEK\n" + meals.join("\n");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}
function needItems() {
  if (exportItems().length) return true;
  toast(plan.length ? "Everything is checked off. Untick “Leave out checked items” to include them." : "Add some meals to your plan first.");
  return false;
}
async function copyList() {
  if (!needItems()) return;
  const text = listText(false);
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  toast("Copied! Paste it into Notes, a text, or Google Keep.");
}
function emailList() {
  if (!needItems()) return;
  location.href = "mailto:?subject=" + encodeURIComponent("Shopping list") + "&body=" + encodeURIComponent(listText(false));
}
function makeQR(text) {
  try {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    const qr = qrcode(0, "L");
    qr.addData(text, "Byte");
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  } catch (e) { return null; }
}
function showQR() {
  if (!needItems()) return;
  const out = document.getElementById("qrout");
  let text = listText(true);
  let svg = makeQR(text);
  if (!svg) {
    text = text.replace(/^Shopping list\n/, "").replace(/^- /gm, "");
    svg = makeQR(text);
  }
  out.innerHTML = svg
    ? `<div class="qrimg">${svg}</div><p class="small">${exportItems().length} items</p>`
    : `<p style="margin:16px 0">This list is too long for one QR code. Use <b>Copy list</b> or <b>Email list</b> instead, or tick off items you already have.</p>`;
  document.getElementById("qrbox").classList.add("open");
}
function closeQR() { document.getElementById("qrbox").classList.remove("open"); }
document.getElementById("qrbox").addEventListener("click", e => { if (e.target.id === "qrbox") closeQR(); });

function showTab(t) {
  document.getElementById("view-recipes").hidden = t !== "recipes";
  document.getElementById("view-plan").hidden = t !== "plan";
  document.getElementById("tab-recipes").setAttribute("aria-selected", t === "recipes");
  document.getElementById("tab-plan").setAttribute("aria-selected", t === "plan");
  try { localStorage.setItem(STORE + ".tab", t); } catch (e) {}
  if (t === "plan") renderPlan();
}
function printPlan() {
  document.body.classList.add("printing-plan");
  window.print();
  document.body.classList.remove("printing-plan");
}
document.getElementById("clearPlan").onclick = () => { plan = []; checked = {}; planChanged(); };
document.getElementById("uncheck").onclick = () => { checked = {}; savePlan(); renderShop(); };

function closeDetail() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
}
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeQR(); closeDetail(); } });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("clear").onclick = () => {
  state.q = ""; document.getElementById("q").value = "";
  GROUPS.forEach(x => state.sel[x.key].clear());
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  render();
};

document.getElementById("count").textContent = `${RECIPES.length} recipes · tap one to see the full recipe`;
buildFilters();
render();
renderPlan();
try { if (localStorage.getItem(STORE + ".tab") === "plan") showTab("plan"); } catch (e) {}
if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1)));
</script>
